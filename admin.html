<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Dire - Admin Portal</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { color: #ff6600; margin-top: 0; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input[type="text"], input[type="number"], input[type="password"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        input[type="file"] { padding: 5px 0; }
        button { background-color: #ff6600; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; width: 100%; }
        button:hover { background-color: #e55b00; }
        #responseMessage { margin-top: 15px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h2>E-Dire Admin Portal</h2>
        <form id="productForm">
            <div class="form-group">
                <label for="title">Product Title:</label>
                <input type="text" id="title" name="title" required>
            </div>
            <div class="form-group">
                <label for="price">Price:</label>
                <input type="text" id="price" name="price" required>
            </div>
            <div class="form-group">
                <label for="category">Category:</label>
                <input type="text" id="category" name="category" required>
            </div>
            <div class="form-group">
                <label for="sellerPhone">Seller Phone Number:</label>
                <input type="text" id="sellerPhone" name="sellerPhone" required>
            </div>
            <div class="form-group">
                <label for="displayOrder">Display Order (Priority number):</label>
                <input type="number" id="displayOrder" name="displayOrder" value="0">
            </div>
            <div class="form-group">
                <label for="imageFile">Product Image:</label>
                <input type="file" id="imageFile" name="image" accept="image/*" required>
            </div>
            <div class="form-group">
                <label for="adminPassword">Admin Password:</label>
                <input type="password" id="adminPassword" name="password" required placeholder="Enter admin password">
            </div>
            <button type="submit">Upload Product</button>
        </form>
        <div id="responseMessage"></div>
    </div>

    <script>
        document.getElementById('productForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const msgDiv = document.getElementById('responseMessage');
            msgDiv.style.color = '#555';
            msgDiv.textContent = 'Uploading product...';

            const formData = new FormData();
            formData.append('title', document.getElementById('title').value);
            formData.append('price', document.getElementById('price').value);
            formData.append('category', document.getElementById('category').value);
            formData.append('sellerPhone', document.getElementById('sellerPhone').value);
            formData.append('displayOrder', document.getElementById('displayOrder').value);
            formData.append('image', document.getElementById('imageFile').files[0]);
            formData.append('password', document.getElementById('adminPassword').value);

            try {
                const response = await fetch('/api/products', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();

                if (response.ok && result.success) {
                    msgDiv.style.color = 'green';
                    msgDiv.textContent = 'Product uploaded successfully!';
                    document.getElementById('productForm').reset();
                } else {
                    msgDiv.style.color = 'red';
                    msgDiv.textContent = result.error || 'Failed to upload product. Check your password.';
                }
            } catch (err) {
                msgDiv.style.color = 'red';
                msgDiv.textContent = 'Network error occurred while uploading.';
            }
        });
    </script>
</body>
</html>
